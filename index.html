<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neerslag NL — KNMI Open Data</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #111827;
            color: #e5e7eb;
            height: 100vh; /* terugval voor oudere browsers */
            height: 100dvh; /* werkelijke zichtbare hoogte op mobiel, zonder de verschuivende adres-/werkbalk mee te tellen */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Topbar ── */
        #topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
            flex-shrink: 0;
            z-index: 1000;
        }

        #topbar h1 {
            font-size: 15px;
            font-weight: 700;
            color: #7dd3fc;
            white-space: nowrap;
        }

        .mode-toggle {
            display: flex;
            background: #111827;
            border-radius: 8px;
            padding: 3px;
            gap: 2px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: #9ca3af;
            padding: 5px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .mode-btn.active {
            background: #1d4ed8;
            color: #fff;
        }

        .mode-btn:hover:not(.active) {
            background: #374151;
            color: #e5e7eb;
        }

        #time-display {
            font-size: 13px;
            color: #7dd3fc;
            font-weight: 600;
            min-width: 170px;
            background: #111827;
            padding: 5px 12px;
            border-radius: 6px;
            text-align: center;
        }

        #status-badge {
            font-size: 11px;
            color: #6b7280;
            margin-left: auto;
        }

        #status-badge.ok { color: #34d399; }
        #status-badge.error { color: #f87171; }
        #status-badge.loading { color: #fbbf24; }

        /* ── Map ── */
        #map {
            flex: 1;
            min-height: 0;
        }

        /* ── Bottom controls ── */
        #controls {
            background: #1f2937;
            border-top: 1px solid #374151;
            padding: 12px 16px;
            flex-shrink: 0;
        }

        .ctrl-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            background: #374151;
            border: none;
            color: #e5e7eb;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .ctrl-btn:hover { background: #4b5563; }
        .ctrl-btn.play-btn { background: #1d4ed8; }
        .ctrl-btn.play-btn:hover { background: #2563eb; }

        #timeline {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            background: #374151;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        #timeline::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #7dd3fc;
            cursor: pointer;
            box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.2);
        }

        #timeline::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #7dd3fc;
            cursor: pointer;
            border: none;
        }

        .frame-label {
            font-size: 11px;
            color: #6b7280;
            min-width: 40px;
            text-align: right;
            flex-shrink: 0;
        }

        /* ── Legend ── */
        #legend {
            position: absolute;
            right: 12px;
            bottom: 110px;
            z-index: 900;
            background: rgba(31, 41, 55, 0.92);
            border: 1px solid #374151;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 11px;
        }

        #legend .title {
            color: #9ca3af;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .legend-bar-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .legend-gradient {
            height: 10px;
            width: 196px;
            border-radius: 3px;
            /* Zelfde kleurstops als de server gebruikt bij het renderen. */
            background: linear-gradient(to right,
                rgb(208, 240, 255) 0%,
                rgb(112, 200, 255) 16.7%,
                rgb(0, 102, 255) 33.3%,
                rgb(0, 204, 68) 50%,
                rgb(255, 238, 0) 66.7%,
                rgb(255, 102, 0) 83.3%,
                rgb(204, 0, 0) 100%
            );
            margin-top: 4px;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            color: #9ca3af;
            font-size: 10px;
            margin-top: 3px;
        }

        /* ── Mobiel ── */
        @media (max-width: 600px) {
            #topbar {
                flex-wrap: wrap;
                gap: 6px;
                padding: 8px 10px;
            }

            #topbar h1 {
                font-size: 14px;
                flex: 1;
            }

            #status-badge {
                margin-left: 0;
                font-size: 11px;
            }

            .mode-toggle {
                width: 100%;
                order: 3;
            }

            .mode-btn {
                flex: 1;
                text-align: center;
                padding: 6px 8px;
                font-size: 12px;
            }

            #time-display {
                order: 4;
                width: 100%;
                min-width: unset;
                font-size: 12px;
                padding: 4px 8px;
            }

            #controls {
                padding: 10px 10px;
            }

            .ctrl-btn {
                width: 42px;
                height: 42px;
                font-size: 16px;
            }

            #timeline::-webkit-slider-thumb {
                width: 22px;
                height: 22px;
            }

            #timeline::-moz-range-thumb {
                width: 22px;
                height: 22px;
            }

            #timeline {
                height: 6px;
            }

            #legend {
                bottom: 130px;
                right: 8px;
                padding: 7px 9px;
            }
        }

        /* ── Leaflet overrides ── */
        .leaflet-control-zoom {
            border: none !important;
        }
        .leaflet-control-zoom a {
            background: #1f2937 !important;
            color: #e5e7eb !important;
            border-color: #374151 !important;
        }
        .leaflet-control-zoom a:hover {
            background: #374151 !important;
        }
        .leaflet-control-attribution {
            background: rgba(17, 24, 39, 0.8) !important;
            color: #4b5563 !important;
            font-size: 10px !important;
        }
        .leaflet-control-attribution a { color: #6b7280 !important; }
    </style>
</head>
<body>

<!-- Topbar -->
<div id="topbar">
    <h1>🌧 Neerslag NL</h1>
    <div class="mode-toggle">
        <button class="mode-btn active" id="btn-history" onclick="setMode('history')">Afgelopen 2 uur</button>
        <button class="mode-btn" id="btn-forecast" onclick="setMode('forecast')">Voorspelling 2 uur</button>
    </div>
    <div id="time-display">—</div>
    <span id="status-badge" class="loading">● Laden...</span>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Legenda (over de kaart); kleuren gelijk aan KLEURSTOPS in render.py -->
<div id="legend">
    <div class="title">Neerslag (mm/uur)</div>
    <div class="legend-gradient"></div>
    <div class="legend-labels">
        <span>0,1</span><span>0,3</span><span>1</span><span>3</span>
        <span>10</span><span>30</span><span>100</span>
    </div>
</div>

<!-- Bottom controls -->
<div id="controls">
    <div class="ctrl-row">
        <button class="ctrl-btn" onclick="stepFrame(-1)" title="Vorige frame">⏮</button>
        <button class="ctrl-btn play-btn" id="btn-play" onclick="togglePlay()" title="Afspelen / Pauzeren">▶</button>
        <button class="ctrl-btn" onclick="stepFrame(1)" title="Volgende frame">⏭</button>
        <input type="range" id="timeline" min="0" max="24" value="24" oninput="onSlider(this.value)"/>
        <span class="frame-label" id="frame-label">25/25</span>
    </div>
</div>

<script>
// ── Kaart initialiseren ────────────────────────────────────────────────────────
// Beginweergave: heel Nederland in beeld, met Haarlem gemarkeerd.
const NL_GRENZEN = [[50.7, 3.2], [53.6, 7.3]];
const map = L.map('map', { zoomControl: true });
map.fitBounds(NL_GRENZEN);

L.circleMarker([52.387, 4.646], {
    radius: 5, color: '#1d4ed8', fillColor: '#3b82f6',
    fillOpacity: 0.9, weight: 2
}).addTo(map).bindTooltip('Haarlem');

// Basiskaart: CartoDB Positron (licht, neutraal)
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
}).addTo(map);

// ── Toestand ──────────────────────────────────────────────────────────────────
// Radarbeelden komen niet meer via live WMS-tegels van KNMI; de server rendert
// ze zelf (systemd-dienst knmi_radar) naar /data/frames.json en PNG's onder
// /data/history/ en /data/forecast/. De browser haalt alleen die bestanden op.
let mode = 'history';
let frameData = { history: [], forecast: [], bounds: null, errors: [] };
let frames = [];
let currentFrame = 0;
let playing = false;
let playTimer = null;
let radarLayer = null;
let refreshTimer = null;

const VERVERS_MS = 5 * 60 * 1000; // server werkt frames.json elke 5 minuten bij

// ── Gegevens ophalen ──────────────────────────────────────────────────────────
async function haalFrames() {
    const antwoord = await fetch('data/frames.json', { cache: 'no-store' });
    if (!antwoord.ok) throw new Error(`HTTP ${antwoord.status}`);
    return antwoord.json();
}

function formatTime(d) {
    return d.toLocaleString('nl-NL', {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit',
        timeZone: 'Europe/Amsterdam'
    });
}

// ── Radarlaag (één kaartdekkend beeld per frame, aangeleverd door de server) ──
function toonFrame(frame) {
    // Queryparameter voorkomt een verouderd beeld uit de browsercache; vooral
    // van belang bij de verwachting, waarvan de bestandsnamen worden hergebruikt.
    const url = `data/${frame.file}?t=${encodeURIComponent(frame.time)}`;
    if (!radarLayer) {
        radarLayer = L.imageOverlay(url, frameData.bounds, {
            opacity: 0.85,
            attribution: 'Radardata: <a href="https://dataplatform.knmi.nl">KNMI</a> (CC-BY-4.0)'
        });
        radarLayer.on('load', () => setStatus('ok', '● Live'));
        radarLayer.on('error', () => setStatus('error', '● Beeld niet gevonden'));
        radarLayer.addTo(map);
    } else {
        setStatus('loading', '● Laden...');
        radarLayer.setUrl(url);
    }
}

// ── Frame bijwerken ───────────────────────────────────────────────────────────
function goToFrame(idx) {
    if (!frames.length) return;
    currentFrame = Math.max(0, Math.min(frames.length - 1, idx));
    const f = frames[currentFrame];
    const t = new Date(f.time);

    // Tijdweergave
    document.getElementById('time-display').textContent = formatTime(t);
    document.getElementById('timeline').value = currentFrame;
    document.getElementById('frame-label').textContent =
        `${currentFrame + 1}/${frames.length}`;

    // Markeer toekomst
    const isFuture = mode === 'forecast' && currentFrame > 0;
    document.getElementById('time-display').style.color = isFuture ? '#fbbf24' : '#7dd3fc';

    toonFrame(f);
}

// ── Modus wisselen ────────────────────────────────────────────────────────────
// pasModusToe wisselt de reeks zonder het afspelen te onderbreken; setMode is
// voor de knoppen en stopt het afspelen eerst. Geeft true terug bij succes.
function pasModusToe(m, startIdx) {
    mode = m;

    document.getElementById('btn-history').classList.toggle('active', m === 'history');
    document.getElementById('btn-forecast').classList.toggle('active', m === 'forecast');

    frames = frameData[m] || [];
    document.getElementById('timeline').max = Math.max(frames.length - 1, 0);

    if (!frames.length) {
        setStatus('error', '● Geen gegevens');
        document.getElementById('time-display').textContent = '—';
        document.getElementById('frame-label').textContent = '0/0';
        return false;
    }

    if (startIdx === undefined) startIdx = m === 'history' ? frames.length - 1 : 0;
    goToFrame(startIdx);
    return true;
}

function setMode(m) {
    if (playing) stopPlay();
    pasModusToe(m);
}

// ── Gegevens verversen (eerste keer en daarna elke 5 minuten) ─────────────────
async function ververs(eersteKeer) {
    try {
        if (eersteKeer) setStatus('loading', '● Laden...');
        const data = await haalFrames();
        if (!data.bounds) throw new Error('Geen kaartgrenzen ontvangen');
        frameData = data;

        if (eersteKeer) {
            // Direct starten met afspelen: eerst de afgelopen 2 uur,
            // daarna de voorspelling, in een doorlopende lus.
            if (pasModusToe('history', 0)) startPlay();
            return;
        }

        if (playing) {
            // Tijdens het afspelen alleen de gegevens verversen.
            frames = frameData[mode] || [];
            document.getElementById('timeline').max = Math.max(frames.length - 1, 0);
            if (!frames.length) { setStatus('error', '● Geen gegevens'); stopPlay(); return; }
            if (currentFrame >= frames.length) goToFrame(0);
            return;
        }

        const opLaatsteFrame =
            mode === 'history' ? currentFrame >= frames.length - 1 : currentFrame === 0;

        frames = frameData[mode] || [];
        document.getElementById('timeline').max = Math.max(frames.length - 1, 0);

        if (!frames.length) {
            setStatus('error', '● Geen gegevens');
            return;
        }

        const doel = opLaatsteFrame ? (mode === 'history' ? frames.length - 1 : 0) : currentFrame;
        goToFrame(doel);
    } catch (fout) {
        console.error('Kan frames.json niet ophalen:', fout);
        setStatus('error', '● Kan gegevens niet laden');
    }
}

// ── Afspelen ──────────────────────────────────────────────────────────────────
function togglePlay() {
    playing ? stopPlay() : startPlay();
}

function startPlay() {
    playing = true;
    document.getElementById('btn-play').textContent = '⏸';
    document.getElementById('btn-play').title = 'Pauzeren';
    playTimer = setInterval(() => {
        let volgende = currentFrame + 1;
        if (volgende >= frames.length) {
            // Einde van de reeks: door naar de andere reeks, zodat de lus
            // afwisselend de afgelopen 2 uur en de voorspelling toont.
            const andere = mode === 'history' ? 'forecast' : 'history';
            if ((frameData[andere] || []).length) {
                pasModusToe(andere, 0);
                return;
            }
            volgende = 0;
        }
        goToFrame(volgende);
    }, 700);
}

function stopPlay() {
    playing = false;
    clearInterval(playTimer);
    playTimer = null;
    document.getElementById('btn-play').textContent = '▶';
    document.getElementById('btn-play').title = 'Afspelen';
}

function stepFrame(dir) {
    if (playing) stopPlay();
    goToFrame(currentFrame + dir);
}

function onSlider(val) {
    if (playing) stopPlay();
    goToFrame(parseInt(val));
}

// ── Status ────────────────────────────────────────────────────────────────────
function setStatus(cls, text) {
    const el = document.getElementById('status-badge');
    el.className = cls;
    el.textContent = text;
}

// ── Start ─────────────────────────────────────────────────────────────────────
ververs(true);
refreshTimer = setInterval(() => ververs(false), VERVERS_MS);
</script>
</body>
</html>
